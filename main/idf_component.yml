dependencies:
  # Only with CONFIG_LS_SSH (boards/ssh.defaults): it will not compile
  # without mbedTLS threading, which only that overlay turns on.
  david-cermak/libssh:
    version: "==0.12.2"
    rules:
      - if: "$CONFIG{LS_SSH} == True"
  chmorgan/esp-audio-player:
    version: "==1.0.7"
    override_path: "../components/chmorgan__esp-audio-player"
  espressif/esp_wifi_remote:
    version: "==0.16.3"
  espressif/esp_hosted:
    version: "==2.12.9"
  espressif/elf_loader: "==1.3.5"
  # SSH for the network terminal (ls_rterm_ssh.c): libssh 0.12 on the
  # IDF's own mbedTLS. LGPL-2.1, which GPLv3 code may use.
  david-cermak/libssh: "==0.12.2"
